[project]
name = "richprompt-testrunner"
version = "0.1.0"
description = "Agent-based routing test runner for the RichPrompt linter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Phase 11: routing decisions via google-genai directly (FunctionDeclaration
# accepts raw JSON schema, so the sidecar can build tools from the web app's
# in-memory registry without exec()-generating Python stubs).
# Phase 12+ will add google-adk for LlmAgent trajectory capture.
genai = [
    "google-genai>=1.0",
]
adk = [
    "google-genai>=1.0",
    "google-adk>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
